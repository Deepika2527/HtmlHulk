<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Tables</title>
</head>
<body>

    <table border="1" style="border-collapse: collapse;" cellspacing="10" cellpadding="10">
        <caption>Nested Table</caption>
        <thead>
            <tr>
                <th>Course</th>
                <th>Duration</th>
                <th>Technologies</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Fullstack</td>
                <td>6months</td>
                <td>
                    <table border="1" style="border-collapse: collapse;" cellspacing="10" cellpadding="20">
                        <tr>
                            <th>Frontnd</th>
                            <th>Backend</th>
                            <th>Database</th>
                        </tr>
                        <tr>
                            <td>frontend with React</td>
                            <td>Python with Django</td>
                            <td>Mysql</td>
                        </tr>
                        <tr>
                            <td>frontend with React</td>
                            <td>Java with spingBoot,..</td>
                            <td>Mysql</td>
                        </tr>
                        <tr>
                            <td>frontend with Angula</td>
                            <td>Python with Django</td>
                            <td>Mongodb</td>
                        </tr>
                    </table>
                </td>
            </tr>
        </tbody>


    </table>
    
</body>
</html>
